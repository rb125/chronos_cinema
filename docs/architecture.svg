<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="620" fill="#0a0a1a"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" fill="#f0eeff" font-size="20" font-weight="700" letter-spacing="-0.5">Chronos Cinema - System Architecture</text>

  <!-- ── FRONTEND box ── -->
  <rect x="30" y="70" width="200" height="480" rx="12" fill="#0f0f2e" stroke="#3730a3" stroke-width="1.5"/>
  <text x="130" y="95" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="700" letter-spacing="1">BROWSER / FRONTEND</text>
  <text x="130" y="110" text-anchor="middle" fill="#6366f1" font-size="9">Next.js 14 + Tailwind CSS</text>

  <rect x="50" y="122" width="160" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="130" y="136" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">Cinema Player</text>
  <text x="130" y="150" text-anchor="middle" fill="#818cf8" font-size="9">Ken Burns - Beat progress</text>

  <rect x="50" y="168" width="160" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="130" y="182" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">Audio Engine</text>
  <text x="130" y="196" text-anchor="middle" fill="#818cf8" font-size="9">Web Audio API - PCM scheduler</text>

  <rect x="50" y="214" width="160" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="130" y="228" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">BGM Engine</text>
  <text x="130" y="242" text-anchor="middle" fill="#818cf8" font-size="9">GainNode - auto-duck / restore</text>

  <rect x="50" y="260" width="160" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="130" y="274" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">Subtitle Overlay</text>
  <text x="130" y="288" text-anchor="middle" fill="#818cf8" font-size="9">Live closed captions</text>

  <rect x="50" y="306" width="160" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="130" y="320" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">Quiz View</text>
  <text x="130" y="334" text-anchor="middle" fill="#818cf8" font-size="9">5 MCQs - scoring - explanations</text>

  <rect x="50" y="352" width="160" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="130" y="366" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">Session History</text>
  <text x="130" y="380" text-anchor="middle" fill="#818cf8" font-size="9">IndexedDB - offline replay</text>

  <rect x="50" y="398" width="160" height="36" rx="6" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="130" y="412" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="600">WebSocket Client</text>
  <text x="130" y="426" text-anchor="middle" fill="#818cf8" font-size="9">ws://backend:8000/ws</text>

  <!-- ── BACKEND box ── -->
  <rect x="290" y="70" width="220" height="480" rx="12" fill="#0f1f0f" stroke="#166534" stroke-width="1.5"/>
  <text x="400" y="95" text-anchor="middle" fill="#4ade80" font-size="11" font-weight="700" letter-spacing="1">BACKEND</text>
  <text x="400" y="110" text-anchor="middle" fill="#22c55e" font-size="9">FastAPI + Python - WebSocket</text>

  <rect x="308" y="122" width="184" height="36" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <text x="400" y="136" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">WebSocket Endpoint /ws</text>
  <text x="400" y="150" text-anchor="middle" fill="#4ade80" font-size="9">per-connection ChronosAgent</text>

  <rect x="308" y="168" width="184" height="36" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <text x="400" y="182" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">Script Worker</text>
  <text x="400" y="196" text-anchor="middle" fill="#4ade80" font-size="9">4-beat blueprint - JSON schema</text>

  <rect x="308" y="214" width="184" height="36" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <text x="400" y="228" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">Image Workers ×4</text>
  <text x="400" y="242" text-anchor="middle" fill="#4ade80" font-size="9">parallel - semaphore-limited</text>

  <rect x="308" y="260" width="184" height="36" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <text x="400" y="274" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">Music Worker</text>
  <text x="400" y="288" text-anchor="middle" fill="#4ade80" font-size="9">concurrent - fallback oscillator</text>

  <rect x="308" y="306" width="184" height="36" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <text x="400" y="320" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">Quiz Worker</text>
  <text x="400" y="334" text-anchor="middle" fill="#4ade80" font-size="9">concurrent with reflection beat</text>

  <rect x="308" y="352" width="184" height="36" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <text x="400" y="366" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">WS Output Queue</text>
  <text x="400" y="380" text-anchor="middle" fill="#4ade80" font-size="9">asyncio.Queue - serial sender</text>

  <rect x="308" y="398" width="184" height="36" rx="6" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <text x="400" y="412" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">Live Keepalive Loop</text>
  <text x="400" y="426" text-anchor="middle" fill="#4ade80" font-size="9">ping every 5s during image wait</text>

  <!-- ── VERTEX AI box ── -->
  <rect x="570" y="70" width="360" height="480" rx="12" fill="#1a0f0f" stroke="#9a3412" stroke-width="1.5"/>
  <text x="750" y="95" text-anchor="middle" fill="#fb923c" font-size="11" font-weight="700" letter-spacing="1">VERTEX AI  -  GCP</text>
  <text x="750" y="110" text-anchor="middle" fill="#f97316" font-size="9">project: us-central1-aiplatform.googleapis.com</text>

  <!-- Gemini Live -->
  <rect x="588" y="122" width="324" height="60" rx="6" fill="#2d1515" stroke="#c2410c" stroke-width="1"/>
  <text x="750" y="140" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="700">Gemini Live  -  v1beta1</text>
  <text x="750" y="155" text-anchor="middle" fill="#fb923c" font-size="9">gemini-live-2.5-flash-native-audio</text>
  <text x="750" y="170" text-anchor="middle" fill="#9a3412" font-size="8">BidiGenerateContent WebSocket - PCM audio + transcription</text>

  <!-- Gemini Flash script -->
  <rect x="588" y="196" width="152" height="60" rx="6" fill="#2d1515" stroke="#c2410c" stroke-width="1"/>
  <text x="664" y="214" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="700">Gemini 2.5 Flash  -  v1</text>
  <text x="664" y="229" text-anchor="middle" fill="#fb923c" font-size="9">generateContent</text>
  <text x="664" y="244" text-anchor="middle" fill="#9a3412" font-size="8">Script blueprint + Quiz</text>

  <!-- Gemini Image -->
  <rect x="752" y="196" width="160" height="60" rx="6" fill="#2d1515" stroke="#c2410c" stroke-width="1"/>
  <text x="832" y="214" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="700">Gemini Flash Image  -  v1</text>
  <text x="832" y="229" text-anchor="middle" fill="#fb923c" font-size="9">generateContent/IMAGE</text>
  <text x="832" y="244" text-anchor="middle" fill="#9a3412" font-size="8">gemini-2.5-flash-image</text>

  <!-- Lyria -->
  <rect x="588" y="270" width="324" height="60" rx="6" fill="#2d1515" stroke="#c2410c" stroke-width="1"/>
  <text x="750" y="288" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="700">Lyria 002  -  v1</text>
  <text x="750" y="303" text-anchor="middle" fill="#fb923c" font-size="9">publishers/google/models/lyria-002:predict</text>
  <text x="750" y="318" text-anchor="middle" fill="#9a3412" font-size="8">REST - ADC bearer token - WAV response</text>

  <!-- ADC note -->
  <rect x="588" y="344" width="324" height="40" rx="6" fill="#1a1a0a" stroke="#713f12" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="750" y="360" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">Auth: Application Default Credentials (ADC)</text>
  <text x="750" y="375" text-anchor="middle" fill="#92400e" font-size="8">gcloud auth application-default login - quota-project set</text>

  <!-- API versions note -->
  <rect x="588" y="398" width="324" height="50" rx="6" fill="#1a1a0a" stroke="#713f12" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="750" y="416" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="600">Isolated Clients (version conflict fix)</text>
  <text x="750" y="431" text-anchor="middle" fill="#92400e" font-size="8">generate_content → v1 client</text>
  <text x="750" y="445" text-anchor="middle" fill="#92400e" font-size="8">Gemini Live WebSocket → v1beta1 client</text>

  <!-- ── ARROWS: Frontend ↔ Backend ── -->
  <!-- WS bidirectional -->
  <line x1="230" y1="415" x2="288" y2="415" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="290" y1="408" x2="232" y2="408" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="260" y="403" text-anchor="middle" fill="#818cf8" font-size="8">WebSocket</text>
  <text x="260" y="425" text-anchor="middle" fill="#818cf8" font-size="8">JSON frames</text>

  <!-- ── ARROWS: Backend → Vertex AI ── -->
  <!-- Live -->
  <line x1="512" y1="152" x2="566" y2="152" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-gold)"/>
  <text x="539" y="147" text-anchor="middle" fill="#fbbf24" font-size="8">WSS</text>

  <!-- Script/Quiz -->
  <line x1="512" y1="226" x2="586" y2="226" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-gold)"/>
  <text x="549" y="221" text-anchor="middle" fill="#fbbf24" font-size="8">HTTPS</text>

  <!-- Image -->
  <line x1="512" y1="242" x2="750" y2="242" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-gold)"/>

  <!-- Lyria -->
  <line x1="512" y1="300" x2="586" y2="300" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-gold)"/>
  <text x="549" y="295" text-anchor="middle" fill="#fbbf24" font-size="8">REST</text>

  <!-- ── DATA FLOW labels on right side ── -->
  <text x="480" y="575" text-anchor="middle" fill="#4b5563" font-size="9">audio_chunk - image - bgm_audio - narration - quiz_data - beat_start - story_complete</text>
  <text x="480" y="590" text-anchor="middle" fill="#374151" font-size="8">← all streamed over a single WebSocket connection as JSON frames →</text>

  <!-- Legend -->
  <line x1="60" y1="555" x2="90" y2="555" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="95" y="559" fill="#818cf8" font-size="9">WebSocket (browser ↔ backend)</text>
  <line x1="260" y1="555" x2="290" y2="555" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-gold)"/>
  <text x="295" y="559" fill="#fbbf24" font-size="9">Vertex AI API call</text>
  <rect x="430" y="548" width="10" height="10" rx="2" fill="#1e1b4b" stroke="#4338ca" stroke-width="1"/>
  <text x="445" y="558" fill="#818cf8" font-size="9">Frontend component</text>
  <rect x="580" y="548" width="10" height="10" rx="2" fill="#052e16" stroke="#166534" stroke-width="1"/>
  <text x="595" y="558" fill="#4ade80" font-size="9">Backend worker</text>
  <rect x="720" y="548" width="10" height="10" rx="2" fill="#2d1515" stroke="#c2410c" stroke-width="1"/>
  <text x="735" y="558" fill="#fb923c" font-size="9">GCP / Vertex AI model</text>
</svg>
